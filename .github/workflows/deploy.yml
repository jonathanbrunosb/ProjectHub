name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build de producao
        env:
          # Somente chaves publicas (anon). A service_role nunca e exposta ao
          # frontend - operacoes privilegiadas ficam em Edge Functions.
          # Configure em Settings > Secrets and variables > Actions.
          #
          # QA e PRD sao projetos Supabase separados. Sem as chaves _QA_, o
          # build usa VITE_SUPABASE_URL/ANON_KEY como ambiente de QA, o que
          # mantem instalacoes anteriores funcionando sem reconfiguracao.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_QA_URL: ${{ secrets.VITE_SUPABASE_QA_URL }}
          VITE_SUPABASE_QA_ANON_KEY: ${{ secrets.VITE_SUPABASE_QA_ANON_KEY }}
          VITE_SUPABASE_PRD_URL: ${{ secrets.VITE_SUPABASE_PRD_URL }}
          VITE_SUPABASE_PRD_ANON_KEY: ${{ secrets.VITE_SUPABASE_PRD_ANON_KEY }}
          # Dominio proprio (public/CNAME) serve o app na raiz. Sem esse arquivo,
          # o GitHub Pages usaria /<repo>/ e o base path precisaria refletir isso.
          VITE_BASE_PATH: /
        run: npm run build

      - name: Verificar que nenhum segredo entrou no bundle
        run: |
          set -e
          if grep -rIlE 'service_role|SUPABASE_SERVICE_ROLE' dist/ 2>/dev/null; then
            echo "::error::Possivel segredo encontrado no bundle. Deploy abortado."
            exit 1
          fi

      - name: SPA fallback para deep links
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build de producao
        env:
          # Somente chaves publicas. A service_role nunca e exposta ao frontend:
          # configure as duas variaveis em Settings > Secrets and variables > Actions.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # GitHub Pages serve em /<repo>/; o base path precisa refletir isso.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Verificar que nenhum segredo entrou no bundle
        run: |
          set -e
          if grep -rIlE 'service_role|SUPABASE_SERVICE_ROLE' dist/ 2>/dev/null; then
            echo "::error::Possivel segredo encontrado no bundle. Deploy abortado."
            exit 1
          fi

      - name: SPA fallback para deep links
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

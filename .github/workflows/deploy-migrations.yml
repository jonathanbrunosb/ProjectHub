name: Aplicar migrations em QA/PRD

# Fecha uma lacuna operacional real: ate aqui, migration mesclada em `main` so
# chegava a QA/PRD quando alguem lembrava de aplicar manualmente (SQL Editor
# ou Supabase CLI). Isso ja gerou schema divergente e silencioso entre `main`
# e os bancos hospedados. QA aplica automaticamente a cada push; PRD exige
# aprovacao manual via GitHub Environment (`production`) - nunca aplica
# sozinho em producao.
#
# So dispara quando supabase/migrations/** muda, para nao rodar a toa em
# todo merge. `supabase db push` e idempotente: so aplica o que ainda nao
# esta registrado em supabase_migrations.schema_migrations no projeto de
# destino, entao um re-run apos uma migration ja aplicada e um no-op seguro.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  migrate-qa:
    name: QA
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrations pendentes em QA
        # --db-url (pooler Supavisor, modo sessao) em vez de --project-ref/--password:
        # a conexao direta (db.<ref>.supabase.co) so resolve em IPv6, que o runner do
        # GitHub Actions nao suporta ("IPv6 is not supported on your current network").
        # O pooler e' sempre IPv4. A connection string completa (com senha embutida)
        # vem do proprio painel Supabase (Connect -> Session pooler), entao nao ha
        # necessidade de adivinhar o shard aws-0/aws-1 do projeto.
        run: |
          supabase db push --yes --db-url "${{ secrets.SUPABASE_QA_DB_URL }}"

  migrate-prd:
    name: PRD (requer aprovacao manual)
    needs: migrate-qa
    runs-on: ubuntu-latest
    # Environment "production" precisa existir no repo (Settings -> Environments)
    # com "Required reviewers" configurado - e o gate manual antes de tocar o
    # banco de producao. Sem essa configuracao, o job fica pendente indefinidamente
    # em vez de aplicar sozinho, o que e o comportamento seguro por padrao.
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrations pendentes em PRD
        # --include-all: PRD ficou sem duas migrations que QA ja tinha
        # (0019_service_role_grants e a fix da view de alocacao, ver PR #74),
        # entao a proxima pendente e' anterior a ultima ja aplicada - o CLI
        # recusa por seguranca sem essa flag. Conteudo das duas ja' revisado
        # e confirmado idempotente antes de habilitar isto.
        run: |
          supabase db push --yes --include-all --db-url "${{ secrets.SUPABASE_PRD_DB_URL }}"

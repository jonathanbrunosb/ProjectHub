name: Aplicar migrations em PRD

# Fecha uma lacuna operacional real: ate aqui, migration mesclada em `main` so
# chegava a PRD quando alguem lembrava de aplicar manualmente (SQL Editor ou
# Supabase CLI). Isso ja gerou schema divergente e silencioso entre `main` e
# o banco hospedado. PRD exige aprovacao manual via GitHub Environment
# (`production`) - nunca aplica sozinho em producao.
#
# O projeto QA foi pausado (custo de compute de um 3o projeto Supabase na
# mesma organizacao, sem uso que justificasse manter rodando - ver
# OPERACAO.md e AMBIENTES.md). Isto ja removeu o job de aplicar migrations
# em QA, que existia antes deste arquivo: a validacao real de schema nunca
# dependeu dele, o job "database" do ci.yml ja sobe um Postgres efemero do
# zero e roda schema + seed + toda a suite de testes (RLS, regras de
# negocio, ambiente) em todo push/PR, antes de qualquer coisa chegar em
# main. QA vivo so servia para "ver rodando" numa instancia hospedada real,
# redundante com isso.
#
# So dispara quando supabase/migrations/** muda, para nao rodar a toa em
# todo merge. `supabase db push` e idempotente: so aplica o que ainda nao
# esta registrado em supabase_migrations.schema_migrations no projeto de
# destino, entao um re-run apos uma migration ja aplicada e um no-op seguro.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  migrate-prd:
    name: PRD (requer aprovacao manual)
    runs-on: ubuntu-latest
    # Environment "production" precisa existir no repo (Settings -> Environments)
    # com "Required reviewers" configurado - e o gate manual antes de tocar o
    # banco de producao. Sem essa configuracao, o job fica pendente indefinidamente
    # em vez de aplicar sozinho, o que e o comportamento seguro por padrao.
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrations pendentes em PRD
        # --include-all: PRD ficou sem duas migrations que QA ja tinha
        # (0019_service_role_grants e a fix da view de alocacao, ver PR #74),
        # entao a proxima pendente e' anterior a ultima ja aplicada - o CLI
        # recusa por seguranca sem essa flag. Conteudo das duas ja' revisado
        # e confirmado idempotente antes de habilitar isto.
        run: |
          supabase db push --yes --include-all --db-url "${{ secrets.SUPABASE_PRD_DB_URL }}"

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Testes unitarios e de componente
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verificar que nenhum segredo entrou no bundle
        run: |
          set -e
          # A chave service_role NUNCA pode estar no bundle publicado.
          if grep -rIlE 'service_role|SUPABASE_SERVICE_ROLE|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9' dist/ 2>/dev/null; then
            echo "::error::Possivel segredo encontrado no bundle de producao."
            exit 1
          fi
          echo "Nenhum segredo encontrado no bundle."

  database:
    name: Banco de dados (schema, seed, RLS, regras de negocio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar o PostgreSQL ja instalado na imagem do runner
        # O container de servico (`services: postgres: image: postgres:16`) puxava a
        # imagem do Docker Hub anonimamente a cada run - sujeito ao rate limit
        # ("toomanyrequests: You have reached your unauthenticated pull rate limit"),
        # que passou a derrubar o job antes mesmo do checkout rodar. O runner
        # ubuntu-24.04 ja vem com PostgreSQL pre-instalado como servico do sistema
        # justamente para esse caso - nao depende de pull nenhum.
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          pg_isready -h localhost -p 5432

      - name: Aplicar migrations, seed e rodar os testes
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: ./supabase/tests/run.sh
